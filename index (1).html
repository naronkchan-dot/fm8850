<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบฟังวิทยุออนไลน์ฟรี</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }
        .logo-area {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }
        .status { color: #10b981; font-size: 0.9rem; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .status::before { content: ""; width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; }
        
        .controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .btn {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
        }
        .btn:hover { background-color: #4338ca; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        
        .volume-container { display: flex; align-items: center; gap: 1rem; background: #0f172a; padding: 0.75rem 1.2rem; border-radius: 50px; }
        .volume-slider { flex: 1; accent-color: var(--primary-color); cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">📻</div>
        <h1>สถานีวิทยุออนไลน์</h1>
        <div class="status">กำลังออกอากาศ Live</div>

        <!-- ตัวเล่นเสียงซ่อนไว้เพื่อใช้ปุ่ม Custom Custom -->
        <audio id="radioPlayer" preload="none">
            <!-- ใส่ลิงก์ Stream วิทยุของคุณที่นี่ -->
            <source src="https://fmsanglar.ddnsbycat.com:9001" type="audio/mpeg">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิทยุนี้
        </audio>

        <div class="controls">
            <button class="btn" id="playBtn" onclick="togglePlay()">▶ กดเพื่อรับฟัง</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.1" value="0.8" oninput="changeVolume(this.value)">
        </div>
    </div>

    <script>
        const player = document.getElementById('radioPlayer');
        const playBtn = document.getElementById('playBtn');

        function togglePlay() {
            if (player.paused) {
                // เคลียร์แคชตัวสตรีมมิ่งเพื่อให้เป็นเวลาปัจจุบันที่สุดเวลาเปิดฟัง
                const currentSrc = player.src;
                player.src = '';
                player.src = currentSrc;
                
                player.play()
                    .then(() => {
                        playBtn.innerText = '⏸ หยุดฟัง';
                        playBtn.style.backgroundColor = '#ef4444';
                    })
                    .catch(error => {
                        alert('ไม่สามารถเล่นสตรีมนี้ได้ กรุณาตรวจสอบลิงก์สตรีมของคุณ');
                        console.error(error);
                    });
            } else {
                player.pause();
                playBtn.innerText = '▶ กดเพื่อรับฟัง';
                playBtn.style.backgroundColor = '#4f46e5';
            }
        }

        function changeVolume(val) {
            player.volume = val;
        }
    </script>
</body>
</html>
