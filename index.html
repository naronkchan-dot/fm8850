<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM88.50MHz music line station</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .logo {
            font-size: 5rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite ease-in-out;
        }
        h1 {
            font-size: 2rem;
            color: #00ffcc;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        p {
            font-size: 1rem;
            color: #a0a0c0;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* ปุ่มลิงก์ภายนอกสำหรับกดฟัง */
        .listen-btn {
            display: inline-block;
            background: #00ffcc;
            color: #0f0f1a;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }
        .listen-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(0, 255, 204, 0.6);
        }
        .note {
            font-size: 0.8rem;
            color: #a0a0c0;
            margin-top: 15px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="logo">📻</div>
        <h1>FM88.50MHz</h1>
        <p>music line station</p>
        
        <!-- ลิงก์ตรงที่กดแล้วจะเปิดแท็บใหม่เพื่อเล่นวิทยุทันที โดยไม่โดน HTTPS บล็อก -->
        <a href="http://fmsanglar.ddnsbycat.com:9001/;stream.mp3" target="_blank" class="listen-btn">
            ▶ กดเพื่อฟังวิทยุออนไลน์
        </a>
        
        <div class="note">*คลิกเพื่อเปิดหน้าต่างเครื่องเล่นวิทยุสด</div>
    </div>

</body>
</html>
