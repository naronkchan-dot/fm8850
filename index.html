<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM88.50MHz music line station | เพลงดีดีเพื่อคุณ</title>
    <style>
        /* ดีไซน์ Luxury Emerald Theme สไตล์ Greenwave */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050b08;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .greenwave-container {
            background: linear-gradient(180deg, rgba(10, 28, 20, 0.8) 0%, rgba(5, 11, 8, 0.95) 100%);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 177, 106, 0.1);
            border: 1px solid rgba(0, 177, 106, 0.15);
            overflow: hidden;
            text-align: center;
            padding-bottom: 30px;
        }
        
        .brand-header {
            background-color: rgba(0, 177, 106, 0.1);
            padding: 12px;
            font-size: 0.75rem;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 177, 106, 0.1);
        }

        .album-art-wrapper {
            margin: 35px auto 20px;
            position: relative;
            width: 220px;
            height: 220px;
        }
        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .slogan {
            font-size: 0.9rem;
            color: #00ffaa;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .audio-wave {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 30px;
            margin-bottom: 30px;
        }
        .wave-bar {
            width: 3px;
            height: 5px;
            background-color: #00ffaa;
            border-radius: 2px;
            animation: bounce 1s infinite alternate;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 12px; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 25px; }
        .wave-bar:nth-child(4) { animation-delay: 0.1s; height: 18px; }
        .wave-bar:nth-child(5) { animation-delay: 0.6s; height: 8px; }
        
        @keyframes bounce {
            from { height: 5px; }
            to { height: 28px; }
        }

        /* ปรับปุ่มให้เป็นแท็กสำหรับลิงก์ข้ามไปแท็บใหม่ */
        .play-btn-green {
            background: linear-gradient(135deg, #00b16a, #00ffaa);
            color: #050b08;
            border: none;
            width: 85%;
            padding: 16px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none; /* เอาเส้นใต้ลิงก์ออก */
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 177, 106, 0.3);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .play-btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 177, 106, 0.5);
            background: #ffffff;
        }

        .program-schedule {
            width: 85%;
            margin: 30px auto 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            font-size: 0.85rem;
            border: 1px solid rgba(0, 177, 106, 0.08);
        }
        .schedule-title {
            color: #00ffaa;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            text-transform: uppercase;
        }
        .schedule-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #d1d5db;
        }

        .fb-link {
            color: #a3a3a3;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .fb-link:hover {
            color: #00ffaa;
        }
    </style>
</head>
<body>

    <div class="greenwave-container">
        <div class="brand-header">Music Line Station Network</div>
        
        <div class="album-art-wrapper">
            <img src="logo.jpg" alt="FM88.50MHz Cover" class="album-art" onerror="this.src='https://placeholder.com'">
        </div>
        
        <h1>FM 88.50 MHz</h1>
        <div class="slogan">ฟังกันเยอะๆ นะจ๊ะ รับฟังออนไลน์ได้</div>
        
        <div class="audio-wave">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <!-- แก้ไขตรงนี้: ปรับปุ่มให้เป็นลิงก์ตรง และใส่ target="_blank" เพื่อให้เปิดในแท็บใหม่ทันที -->
        <a href="http://fmsanglar.ddnsbycat.com:9001/stream.mp3" target="_blank" class="play-btn-green">
            <span>▶</span> LISTEN LIVE ONLINE
        </a>
        
        <div class="program-schedule">
            <div class="schedule-title">📻 ON AIR SCHEDULE</div>
            <div class="schedule-row">
                <span>⏰ เวลาออกอากาศสด:</span>
                <span style="color:#ffffff;">06:00 น. - 18:00 น.</span>
            </div>
            <div class="schedule-row">
                <span>📍 สถานที่ตั้งสถานี:</span>
                <span style="color:#ffffff;">อ.แม่สาย จ.เชียงราย</span>
            </div>
        </div>

        <a href="https://facebook.com" target="_blank" class="fb-link">
            🔗 ไปยังหน้า Facebook แฟนเพจหลัก
        </a>
    </div>

</body>
</html>
