<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM88.50MHz music line station</title>
    <style>
        /* สไตล์หน้าเว็บสไตล์คล้าย COOLISM เน้นความโมเดิร์น */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #0a0f1d 0%, #03050a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px 30px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        
        /* 1. จุดที่แสดงรูปภาพโลโก้ของคุณ */
        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            position: relative;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0a0f1d;
            transition: transform 0.5s ease;
        }
        
        /* เอฟเฟกต์หมุนแผ่นเสียงเบาๆ เมื่อกำลังเล่นเพลงสไตล์เว็บวิทยุหรู */
        .playing .logo-container img {
            animation: rotateLogo 20s linear infinite;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        p {
            font-size: 0.95rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
            font-weight: 600;
        }
        
        /* ปุ่มเปิดหน้าต่างวิทยุ (แก้บั๊ก HTTPS บล็อกเสียง) */
        .play-btn-main {
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #03050a;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .play-btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 255, 204, 0.5);
            letter-spacing: 0.5px;
        }
        
        .station-location {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 25px;
            letter-spacing: 1px;
        }

        @keyframes rotateLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player-card" id="mainCard">
        
        <!-- [จุดใส่รูป] เรียกใช้งานไฟล์รูปภาพชื่อ logo.jpg ที่คุณอัปโหลดขึ้น GitHub -->
        <div class="logo-container">
            <img src="logo.jpg" alt="FM88.50MHz Logo">
        </div>
        
        <h1>FM88.50MHz</h1>
        <p>music line station</p>
        
        <!-- ปุ่มกดเพื่อเปิดหน้าต่างวิทยุสดแบบ Pop-up ไร้รอยต่อ -->
        <button class="play-btn-main" onclick="openCoolPlayer()">
            <span>▶</span> LISTEN LIVE
        </button>
        
        <div class="station-location">MAE SAI • CHIANG RAI</div>
    </div>

    <script>
        function openCoolPlayer() {
            // สั่งเปิดเอฟเฟกต์หมุนภาพที่หน้าเว็บหลักเพื่อความสวยงาม
            document.getElementById('mainCard').classList.add('playing');
            
            // เปิดหน้าต่างย่อยแยกเพื่อเลี่ยงระบบ HTTPS บล็อกลิงก์เสียง HTTP 
            const playerWindow = window.open("", "CoolRadioPlayer", "width=380,height=280,resizable=no");
            playerWindow.document.write(`
                <html>
                <head>
                    <title>LIVE - FM 88.50 MHz</title>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                        body { 
                            background: #03050a; 
                            color: #ffffff; 
                            text-align: center; 
                            font-family: sans-serif; 
                            padding: 40px 20px;
                        }
                        .title { color: #00ffcc; font-size: 1.5rem; margin-bottom: 5px; font-weight: bold; }
                        .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; letter-spacing: 2px; }
                        audio { width: 100%; max-width: 300px; outline: none; }
                        .tip { font-size: 11px; margin-top: 30px; color: #ff3366; opacity: 0.8; }
                    </style>
                </head>
                <body>
                    <div class="title">📻 FM 88.50 MHz</div>
                    <div class="sub">MUSIC LINE STATION</div>
                    <audio controls autoplay>
                        <source src="http://ddnsbycat.com" type="audio/mpeg">
                        เบราว์เซอร์ไม่รองรับระบบเสียงนี้
                    </audio>
                    <div class="tip">*เปิดหน้าต่างนี้ทิ้งไว้เพื่อฟังเพลงอย่างต่อเนื่อง</div>
                </body>
                </html>
            `);
        }
    </script>

</body>
</html>
